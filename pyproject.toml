[project]
name = "diagnostics-regression-lab"
version = "0.1.0"
description = "Device diagnostics pipeline lab: Spark streaming ingest, regression detection that files bugs, REST API, Airflow DAG. Synthetic data only."
requires-python = ">=3.10"
dependencies = ["pyspark==3.5.3", "fastapi==0.115.5", "uvicorn==0.32.1", "prometheus-client"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
airflow = ["apache-airflow==2.10.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
