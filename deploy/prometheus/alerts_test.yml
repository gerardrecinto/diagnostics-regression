rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'diaglab_summary_age_seconds'
        values: '100000+0x20'
      - series: 'diaglab_pipeline_rows{stage="raw_rows"}'
        values: '1000x20'
      - series: 'diaglab_pipeline_rows{stage="rejected_rows"}'
        values: '100x20'
      - series: 'diaglab_pipeline_rows{stage="unaccounted_rows"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: DiaglabSummaryStale
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "Daily summary is over 25 hours old"
              runbook: "Check the diagnostics_daily DAG run, then the Spark ingest task log."
      - eval_time: 15m
        alertname: DiaglabRejectRateHigh
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "More than 5% of incoming events were rejected"
              runbook: "Read the reject_reason breakdown in out/rejects; a client build may be sending a new shape."
      - eval_time: 15m
        alertname: DiaglabRowsUnaccounted
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'diaglab_summary_age_seconds'
        values: '3600+0x20'
      - series: 'diaglab_pipeline_rows{stage="unaccounted_rows"}'
        values: '0x6 7x14'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiaglabRowsUnaccounted
        exp_alerts: []
      - eval_time: 15m
        alertname: DiaglabRowsUnaccounted
        exp_alerts:
          - exp_labels: {severity: page, stage: unaccounted_rows}
            exp_annotations:
              summary: "Rows read are not equal to rows stored plus rejected"
              runbook: "Rows are being lost between the source and the tables. Stop the DAG and diff the counts."
      - eval_time: 15m
        alertname: DiaglabSummaryStale
        exp_alerts: []
